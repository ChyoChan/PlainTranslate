7 58 19 56C6 52 0 48 0 39C0 29 8 22 20 22C27 22 34 25 39 29Z"/></g><g transform="translate(467 0)"><path fill="#000000" fill-rule="evenodd" d="M0 0H10V80H0Z"/></g><g transform="translate(485 0)"><path fill="#000000" fill-rule="evenodd" d="M20 23C28 23 33 27 36 31V24H46V80H36V74C31 79 26 82 20 82C8 82 0 70 0 52C0 35 8 23 20 23Z M22 32C14 32 10 40 10 52C10 64 14 73 22 73C30 73 36 64 36 52C36 40 30 32 22 32Z"/></g><g transform="translate(538 0)"><path fill="#000000" fill-rule="evenodd" d="M10 12H20V24H34V32H20V63C20 71 24 74 32 71V80C17 85 10 77 10 64V32H0V24H10Z"/></g><g transform="translate(579 0)"><path fill="#000000" fill-rule="evenodd" d="M44 52V57H10C12 68 18 73 27 73C33 73 38 71 42 68L46 75C40 80 34 82 26 82C9 82 0 70 0 52C0 34 10 22 24 22C38 22 44 34 44 52Z M10 48H35C34 37 31 31 24 31C17 31 12 37 10 48Z"/></g></g>
</svg><text x="48" y="147" fill="#000000" font-family="system-ui,Arial,sans-serif" font-size="23" font-weight="600">標誌使用指南  /  P / T 留白</text><rect x="48" y="175" width="136" height="44" rx="6" fill="#000000" stroke="#CFD6D5"/><text x="48" y="241" fill="#000000" font-family="system-ui,Arial,sans-serif" font-size="15" font-weight="600">Black</text><text x="48" y="264" fill="#000000" font-family="system-ui,Arial,sans-serif" font-size="15" font-weight="400">#000000</text><text x="48" y="286" fill="#000000" font-family="system-ui,Arial,sans-serif" font-size="12" font-weight="400">RGB 0, 0, 0</text><text x="48" y="306" fill="#000000" font-family="system-ui,Arial,sans-serif" font-size="11" font-weight="400">CMYK 0, 0, 0, 100</text><rect x="236" y="175" width="136" height="44" rx="6" fill="#000000" stroke="#CFD6D5"/><text x="236" y="241" fill="#000000" font-family="system-ui,Arial,sans-serif" font-size="15" font-weight="600">Ink</text><text x="236" y="264" fill="#000000" font-family="system-ui,Arial,sans-serif" font-size="15" font-weight="400">#000000</text><text x="236" y="286" fill="#000000" font-family="system-ui,Arial,sans-serif" font-size="12" font-weight="400">RGB 0, 0, 0</text><text x="236" y="306" fill="#000000" font-family="system-ui,Arial,sans-serif" font-size="11" font-weight="400">CMYK 0, 0, 0, 100</text><rect x="424" y="175" width="136" height="44" rx="6" fill="#FFFFFF" stroke="#CFD6D5"/><text x="424" y="241" fill="#000000" font-family="system-ui,Arial,sans-serif" font-size="15" font-weight="600">White</text><text x="424" y="264" fill="#000000" font-family="system-ui,Arial,sans-serif" font-size="15" font-weight="400">#FFFFFF</text><text x="424" y="286" fill="#000000" font-family="system-ui,Arial,sans-serif" font-size="12" font-weight="400">RGB 255, 255, 255</text><text x="424" y="306" fill="#000000" font-family="system-ui,Arial,sans-serif" font-size="11" font-weight="400">CMYK 0, 0, 0, 0</text><rect x="612" y="175" width="136" height="44" rx="6" fill="#F7F7F7" stroke="#CFD6D5"/><text x="612" y="241" fill="#000000" font-family="system-ui,Arial,sans-serif" font-size="15" font-weight="600">Paper</text><text x="612" y="264" fill="#000000" font-family="system-ui,Arial,sans-serif" font-size="15" font-weight="400">#F7F7F7</text><text x="612" y="286" fill="#000000" font-family="system-ui,Arial,sans-serif" font-size="12" font-weight="400">RGB 247, 247, 247</text><text x="612" y="306" fill="#000000" font-family="system-ui,Arial,sans-serif" font-size="11" font-weight="400">CMYK 0, 0, 0, 3</text><text x="48" y="342" fill="#000000" font-family="system-ui,Arial,sans-serif" font-size="16" font-weight="400">白／黑：21:1    /    Ink／白：21:1</text><text x="48" y="390" fill="#000000" font-family="system-ui,Arial,sans-serif" font-size="19" font-weight="600">01  選用版本</text><text x="48" y="418" fill="#000000" font-family="system-ui,Arial,sans-serif" font-size="15" font-weight="400">Dock／Finder 用黑底 tile；選單列用黑色 template，由 macOS 自動反白。</text><text x="48" y="442" fill="#000000" font-family="system-ui,Arial,sans-serif" font-size="15" font-weight="400">淺色背景用品牌色橫排，深色背景用白色版；方正位置用直排。</text><text x="48" y="466" fill="#000000" font-family="system-ui,Arial,sans-serif" font-size="15" font-weight="400">另附深色 tile 展示版；不代表 App 已實作自動切換 Dock 圖示。</text><text x="48" y="516" fill="#000000" font-family="system-ui,Arial,sans-serif" font-size="19" font-weight="600">02  留白與最小尺寸</text><text x="48" y="544" fill="#000000" font-family="system-ui,Arial,sans-serif" font-size="15" font-weight="400">輪廓外至少保留一個 P 直筆寬（母稿 40／256 單位）；勿填滿容器。</text><text x="48" y="568" fill="#000000" font-family="system-ui,Arial,sans-serif" font-size="15" font-weight="400">獨立符號 16px 用 small 版；一般版 32px；橫排寬 180px；</text><text x="48" y="592" fill="#000000" font-family="system-ui,Arial,sans-serif" font-size="15" font-weight="400">直排寬 160px；字標寬 140px。更小的位置改用獨立符號。</text><text x="48" y="642" fill="#000000" font-family="system-ui,Arial,sans-serif" font-size="19" font-weight="600">03  字標與幾何</text><text x="48" y="670" fill="#000000" font-family="system-ui,Arial,sans-serif" font-size="15" font-weight="400">字標為原創幾何輪廓，不需要外部字型；App 內文沿用系統字型。</text><text x="48" y="694" fill="#000000" font-family="system-ui,Arial,sans-serif" font-size="15" font-weight="400">P 裡的 T 必須透明；反白符號已減筆重，小尺寸版已擴大留白。</text><text x="48" y="718" fill="#000000" font-family="system-ui,Arial,sans-serif" font-size="15" font-weight="400">不要拉伸、旋轉、重排比例、填掉 T，或加入漸層、描邊及陰影。</text><text x="48" y="768" fill="#000000" font-family="system-ui,Arial,sans-serif" font-size="19" font-weight="600">04  檔案與授權</text><text x="48" y="796" fill="#000000" font-family="system-ui,Arial,sans-serif" font-size="15" font-weight="400">masters：可編輯 SVG；svg／png：螢幕版；app：ICNS 及各尺寸圖示。</text><text x="48" y="820" fill="#000000" font-family="system-ui,Arial,sans-serif" font-size="15" font-weight="400">web：favicon、touch／PWA 圖示；print：保持向量的 RGB PDF。</text><text x="48" y="844" fill="#000000" font-family="system-ui,Arial,sans-serif" font-size="15" font-weight="400">GPL-3.0-or-later；Copyright © 2026 PlainTranslate contributors。</text><text x="48" y="894" fill="#000000" font-family="system-ui,Arial,sans-serif" font-size="19" font-weight="600">05  交付註記</text><text x="48" y="922" fill="#000000" font-family="system-ui,Arial,sans-serif" font-size="15" font-weight="400">CMYK 是未套印刷描述檔的近似值；Pantone 未配對，印刷須另行打樣。</text><text x="48" y="946" fill="#000000" font-family="system-ui,Arial,sans-serif" font-size="15" font-weight="400">已做數碼尺寸、反白及透明度檢查；商標及相似圖像查核另行處理。</text><text x="48" y="970" fill="#000000" font-family="system-ui,Arial,sans-serif" font-size="15" font-weight="400">完整數值、來源與再輸出方式，請見 README.md、GUIDELINES.md。</text><text x="48" y="1077" fill="#000000" font-family="system-ui,Arial,sans-serif" font-size="13" font-weight="400">PlainTranslate  /  Native Mac translation, with your choice of engine.</text></svg>